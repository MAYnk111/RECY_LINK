services:
  # ─── RECY-LINK Frontend (Static Site) ──────────────────────────────
  - type: web
    name: recy-link-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── RECY-LINK FastAPI Backend (Web Service) ──────────────────────
  - type: web
    name: recy-link-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
